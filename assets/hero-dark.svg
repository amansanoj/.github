<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 508" width="1200" height="508" role="img" aria-labelledby="title desc">
<title id="title">Aman Sanoj — software, down to the pins.</title><desc id="desc">Developer in Dubai, UAE. Web apps, terminal interfaces, and connected hardware. A browser, terminal, and ESP32 connected by animated traces.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; }
.fg {fill:#e6e6e6} .muted {fill:#999999} .blue {fill:#afbdd9} .gold {fill:#f0a133}
.mono {font-family:ui-monospace, SFMono-Regular, Consolas, monospace;letter-spacing:1.2px}
.rule {fill:none;stroke:#292929;stroke-width:1}
.trace {fill:none;stroke:#f0a133;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1000;animation:draw 2.2s ease-out backwards}
.reveal {animation:arrive .55s ease-out backwards}
.sweep {fill:none;stroke:#f0a133;stroke-width:2;stroke-linejoin:round;stroke-dasharray:2000;animation:draw 2s ease-out backwards}
@keyframes draw {from {stroke-dashoffset:2000;opacity:0} to {stroke-dashoffset:0;opacity:1}}
@keyframes arrive {from {opacity:0;transform:translateY(5px)} to {opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce) {.trace,.reveal,.sweep {animation:none!important}}
</style>
<rect width="1200" height="508" rx="12" fill="#050505"/>
