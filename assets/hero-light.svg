<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="title desc">
<title id="title">Aman Sanoj — software, down to the pins.</title><desc id="desc">Developer in Dubai, UAE. Web apps, terminal interfaces, and connected hardware. A browser, terminal, and ESP32 joined by an animated signal bus.</desc>
<defs></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.fg {fill:#1a1a1a} .muted {fill:#62626a} .blue {fill:#263450} .gold {fill:#9b5c0a}
.mono {font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:1.2px}
.rule {fill:none;stroke:#dcdde0;stroke-width:1}
.trace {fill:none;stroke:#9b5c0a;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1 1;animation:draw 1.8s ease-out backwards}
.sweep {fill:none;stroke:#9b5c0a;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1 1;animation:draw 1.8s ease-out backwards}
.reveal {animation:arrive .55s ease-out backwards}
.led {animation:blink 2.6s ease-in-out infinite}
@keyframes draw {from {stroke-dashoffset:1;opacity:0} to {stroke-dashoffset:0;opacity:1}}
@keyframes arrive {from {opacity:0;transform:translateY(5px)} to {opacity:1;transform:translateY(0)}}
@keyframes blink {0%,100% {opacity:1} 50% {opacity:.25}}
@media (prefers-reduced-motion:reduce) {.trace,.reveal,.sweep,.led {animation:none!important}}
</style>
<rect x=".5" y=".5" width="1199" height="439" rx="12" fill="#fafafa" stroke="#dcdde0"/>
<text x="44" y="142" class="fg" font-size="124" font-weight="700" letter-spacing="-5">Aman</text><text x="44" y="254" class="fg" font-size="124" font-weight="700" letter-spacing="-5">Sanoj.</text><text x="48" y="314" class="blue" font-size="26" letter-spacing="-.4">Software, down to the pins.</text><text x="48" y="350" class="muted" font-size="18" >Web apps. Terminal interfaces. Connected hardware.</text><path d="M792 102H762V330H792" pathLength="1" class="trace"/><path d="M762 216H792" pathLength="1" class="trace" style="animation-delay:.9s"/><circle cx="762" cy="216" r="3.5" fill="#9b5c0a" class="reveal" style="animation-delay:.9s"/><g class="reveal" style="animation-delay:0.10s"><rect x="792" y="60" width="360" height="84" rx="8" fill="#f0f1f3" stroke="#dcdde0"/><text x="814" y="88" class="muted" font-size="11" letter-spacing="1.2">01 / WEB</text><text x="814" y="113" class="blue" font-size="21" font-weight="600">interface</text><text x="814" y="135" class="muted" font-size="13" >view → event → request</text><circle cx="1096" cy="84" r="3" fill="#62626a" opacity=".6"/><circle cx="1110" cy="84" r="3" fill="#62626a" opacity=".6"/><circle cx="1124" cy="84" r="3" fill="#62626a" opacity=".6"/></g><g class="reveal" style="animation-delay:0.40s"><rect x="792" y="174" width="360" height="84" rx="8" fill="#f0f1f3" stroke="#dcdde0"/><text x="814" y="202" class="muted" font-size="11" letter-spacing="1.2">02 / TUI</text><text x="814" y="227" class="blue" font-size="21" font-weight="600">logic</text><text x="814" y="249" class="muted" font-size="13" >input → state → output</text><text x="1130" y="204" class="gold mono" font-size="16" text-anchor="end" font-weight="700">&gt;_</text></g><g class="reveal" style="animation-delay:0.70s"><path d="M812 281v7M812 372v7" stroke="#263450" stroke-width="2.5"/><path d="M832 281v7M832 372v7" stroke="#263450" stroke-width="2.5"/><path d="M852 281v7M852 372v7" stroke="#263450" stroke-width="2.5"/><path d="M872 281v7M872 372v7" stroke="#263450" stroke-width="2.5"/><path d="M892 281v7M892 372v7" stroke="#263450" stroke-width="2.5"/><path d="M912 281v7M912 372v7" stroke="#263450" stroke-width="2.5"/><path d="M932 281v7M932 372v7" stroke="#263450" stroke-width="2.5"/><path d="M952 281v7M952 372v7" stroke="#263450" stroke-width="2.5"/><path d="M972 281v7M972 372v7" stroke="#263450" stroke-width="2.5"/><path d="M992 281v7M992 372v7" stroke="#263450" stroke-width="2.5"/><path d="M1012 281v7M1012 372v7" stroke="#263450" stroke-width="2.5"/><path d="M1032 281v7M1032 372v7" stroke="#263450" stroke-width="2.5"/><path d="M1052 281v7M1052 372v7" stroke="#263450" stroke-width="2.5"/><path d="M1072 281v7M1072 372v7" stroke="#263450" stroke-width="2.5"/><path d="M1092 281v7M1092 372v7" stroke="#263450" stroke-width="2.5"/><path d="M1112 281v7M1112 372v7" stroke="#263450" stroke-width="2.5"/><path d="M1132 281v7M1132 372v7" stroke="#263450" stroke-width="2.5"/><rect x="792" y="288" width="360" height="84" rx="5" fill="#f0f1f3" stroke="#263450"/><text x="814" y="316" class="muted" font-size="11" letter-spacing="1.2">03 / HARDWARE</text><text x="814" y="341" class="blue" font-size="21" font-weight="600" letter-spacing="1">ESP32</text><text x="814" y="363" class="muted" font-size="13" >pin → signal → light</text><circle cx="1126" cy="312" r="4" fill="#9b5c0a" class="led"/></g>
</svg>
