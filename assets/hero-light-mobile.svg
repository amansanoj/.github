<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="600" height="680" role="img" aria-labelledby="title desc">
<title id="title">Aman Sanoj</title><desc id="desc">Software and embedded systems. Apps, web applications, and firmware.</desc>
<defs></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.fg {fill:#1a1a1a} .muted {fill:#62626a} .blue {fill:#263450} .gold {fill:#9b5c0a}
.mono {font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:1.2px}
.rule {fill:none;stroke:#dcdde0;stroke-width:1}
.trace {fill:none;stroke:#9b5c0a;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1 1;animation:draw 1.8s ease-out backwards}
.sweep {fill:none;stroke:#9b5c0a;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1 1;animation:draw 1.8s ease-out backwards}
.reveal {animation:arrive .55s ease-out backwards}
.led {animation:blink 2.6s ease-in-out infinite}
@keyframes draw {from {stroke-dashoffset:1;opacity:0} to {stroke-dashoffset:0;opacity:1}}
@keyframes arrive {from {opacity:0;transform:translateY(5px)} to {opacity:1;transform:translateY(0)}}
@keyframes blink {0%,100% {opacity:1} 50% {opacity:.25}}
@media (prefers-reduced-motion:reduce) {.trace,.reveal,.sweep,.led {animation:none!important}}
</style>
