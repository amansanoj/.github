<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="600" height="680" role="img" aria-labelledby="title desc">
<title id="title">Aman Sanoj</title><desc id="desc">Software and embedded systems. Apps, web applications, and firmware.</desc>
<defs></defs>
<style>:root{--bg:#050505;--fg:#e6e6e6;--muted:#8d8d92;--line:#26272b;--panel:#101113;--blue:#afbdd9;--gold:#f0a133;--ramp-0:#17191d;--ramp-1:#2a3858;--ramp-2:#465f9a;--ramp-3:#7f94c4;--ramp-4:#c6d2ec}@media(prefers-color-scheme:light){:root{--bg:#fafafa;--fg:#1a1a1a;--muted:#62626a;--line:#dcdde0;--panel:#f0f1f3;--blue:#263450;--gold:#9b5c0a;--ramp-0:#e8eaee;--ramp-1:#c3cde3;--ramp-2:#8199c6;--ramp-3:#4a639a;--ramp-4:#263450}}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.fg {fill:var(--fg)} .muted {fill:var(--muted)} .blue {fill:var(--blue)} .gold {fill:var(--gold)}
.mono {font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:1.2px}
.rule {fill:none;stroke:var(--line);stroke-width:1}
.trace {fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1 1;animation:draw 1.8s ease-out backwards}
.sweep {fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1 1;animation:draw 1.8s ease-out backwards}
.reveal {animation:arrive .55s ease-out backwards}
.led {animation:blink 2.6s ease-in-out infinite}
@keyframes draw {from {stroke-dashoffset:1;opacity:0} to {stroke-dashoffset:0;opacity:1}}
@keyframes arrive {from {opacity:0;transform:translateY(5px)} to {opacity:1;transform:translateY(0)}}
@keyframes blink {0%,100% {opacity:1} 50% {opacity:.25}}
@media (prefers-reduced-motion:reduce) {.trace,.reveal,.sweep,.led {animation:none!important}}
</style>
<rect x=".5" y=".5" width="599" height="679" rx="12" fill="var(--bg)" stroke="var(--line)"/>
<g class="reveal" style="animation-delay:0.08s"><text x="36" y="104" class="fg" font-size="78" font-weight="700" letter-spacing="-3">Aman</text><text x="36" y="182" class="fg" font-size="78" font-weight="700" letter-spacing="-3">Sanoj</text><text x="38" y="230" class="blue" font-size="23" >Software &amp; Embedded Systems</text><text x="38" y="264" class="muted mono" font-size="16" >Swift · TypeScript · Go · C++</text></g><g transform="translate(-614 252)"><g class="reveal" style="animation-delay:.24s"><rect x="650" y="48" width="502" height="344" rx="10" fill="var(--panel)" stroke="var(--line)"/><path d="M678 66h11l5 5v13h-16z M689 66v6h5" fill="none" stroke="var(--muted)" stroke-width="1.2"/><text x="708" y="81" class="muted mono" font-size="13" >projects.toml</text><path d="M650 102H1152" class="rule" /></g><g class="reveal" style="animation-delay:0.42s"><text x="678" y="139" class="blue mono" font-size="15" >[Apps]</text><text x="678" y="166" font-size="14" class="mono"><tspan fill="var(--muted)">project = </tspan><tspan fill="var(--gold)">"Macro Pad"</tspan></text><text x="678" y="188" class="muted mono" font-size="12" ># SwiftUI / CoreBluetooth</text></g><g class="reveal" style="animation-delay:0.60s"><text x="678" y="217" class="blue mono" font-size="15" >[Web]</text><text x="678" y="244" font-size="14" class="mono"><tspan fill="var(--muted)">project = </tspan><tspan fill="var(--gold)">"Tether"</tspan></text><text x="678" y="266" class="muted mono" font-size="12" ># TypeScript / Bun</text></g><g class="reveal" style="animation-delay:0.78s"><text x="678" y="295" class="blue mono" font-size="15" >[Firmware]</text><text x="678" y="322" font-size="14" class="mono"><tspan fill="var(--muted)">project = </tspan><tspan fill="var(--gold)">"NeonOS"</tspan></text><text x="678" y="344" class="muted mono" font-size="12" ># C++ / ESP32</text></g></g>
</svg>
