name: Refresh profile artwork

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_profile.py
      - .github/workflows/refresh-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  refresh:
    if: (github.repository == 'amansanoj/.github' || github.repository == 'amansanoj/amansanoj') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch public activity and render artwork
        run: python3 scripts/build_profile.py --fetch
      - name: Commit changed artwork
        run: |
          git add assets/hero-*.svg assets/activity-*.svg data/contributions.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile artwork [skip ci]'
          git push
